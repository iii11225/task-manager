<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能任务管理系统</title>
  <style>
    * {box-sizing: border-box;margin:0;padding:0;font-family:system-ui}
    body{max-width:700px;margin:30px auto;padding:0 20px;background:#f7f8fa}
    h1{text-align:center;margin-bottom:24px;color:#222}
    .add-box{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
    #taskInput{flex:1;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:16px}
    #prioritySelect{padding:10px;border-radius:8px;border:1px solid #ddd}
    #addBtn{padding:10px 18px;background:#3b82f6;color:#fff;border:none;border-radius:8px;cursor:pointer}
    .filter{margin-bottom:16px}
    .filter button{padding:6px 12px;margin:0 4px;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer}
    .filter button.active{background:#3b82f6;color:white;border-color:#3b82f6}
    .task-item{background:#fff;padding:14px;border-radius:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px #00000012}
    .task-info{display:flex;gap:10px;align-items:center}
    .task-title{font-size:16px}
    .task-title.done{text-decoration:line-through;color:#888}
    .tag-high{color:#dc2626;background:#fee2e2;padding:2px 8px;border-radius:4px;font-size:13px}
    .tag-middle{color:#d97706;background:#fffbeb;padding:2px 8px;border-radius:4px;font-size:13px}
    .tag-low{color:#059669;background:#ecfdf5;padding:2px 8px;border-radius:4px;font-size:13px}
    .btns button{margin-left:6px;padding:6px 10px;border:none;border-radius:6px;cursor:pointer;font-size:14px}
    .btn-toggle{background:#eef2ff;color:#4338ca}
    .btn-del{background:#fef2f2;color:#dc2626}
  </style>
</head>
<body>
  <h1>智能任务管理系统</h1>
  <div class="add-box">
    <input id="taskInput" placeholder="输入新任务...">
    <select id="prioritySelect">
      <option value="高">高</option>
      <option value="中" selected>中</option>
      <option value="低">低</option>
    </select>
    <button id="addBtn">添加任务</button>
  </div>
  <div class="filter">
    <button class="filter-btn active" data-val="全部">全部</button>
    <button class="filter-btn" data-val="高">高优先级</button>
    <button class="filter-btn" data-val="中">中优先级</button>
    <button class="filter-btn" data-val="低">低优先级</button>
  </div>
  <div id="taskList"></div>

  <script>
    const API = "";
    let currentFilter = "全部";
    const taskInput = document.getElementById('taskInput');
    const prioritySelect = document.getElementById('prioritySelect');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');
    const filterBtns = document.querySelectorAll('.filter-btn');

    // 加载任务
    async function loadTasks(){
      const res = await fetch(`${API}/api/tasks`);
      const json = await res.json();
      let list = json.data || [];
      if(currentFilter !== "全部"){
        list = list.filter(item=>item.priority === currentFilter)
      }
      render(list);
    }

    function render(list){
      taskList.innerHTML = "";
      list.forEach(item=>{
        const div = document.createElement('div');
        div.className = "task-item";
        let tagClass = item.priority==='高'?'tag-high':item.priority==='中'?'tag-middle':'tag-low';
        div.innerHTML = `
          <div class="task-info">
            <span class="task-title ${item.completed?'done':''}">${item.title}</span>
            <span class="${tagClass}">${item.priority}</span>
          </div>
          <div class="btns">
            <button class="btn-toggle" data-id="${item.id}" data-ok="${item.completed}">${item.completed ? '未完成':'完成'}</button>
            <button class="btn-del" data-id="${item.id}">删除</button>
          </div>
        `
        taskList.appendChild(div);
      })
      bindEvent();
    }

    function bindEvent(){
      document.querySelectorAll('.btn-toggle').forEach(btn=>{
        btn.onclick = async ()=>{
          const id = btn.dataset.id;
          const completed = btn.dataset.ok !== 'true';
          await fetch(`${API}/api/tasks/${id}`,{
            method:"PATCH",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({completed})
          })
          loadTasks();
        }
      })
      document.querySelectorAll('.btn-del').forEach(btn=>{
        btn.onclick = async ()=>{
          if(!confirm("确定删除？"))return;
          const id = btn.dataset.id;
          await fetch(`${API}/api/tasks/${id}`,{method:"DELETE"})
          loadTasks();
        }
      })
    }

    // 添加
    addBtn.onclick = async ()=>{
      const title = taskInput.value.trim();
      if(!title) return alert("请输入任务");
      await fetch(`${API}/api/tasks`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({title,priority:prioritySelect.value})
      })
      taskInput.value = "";
      loadTasks();
    }
    // 筛选
    filterBtns.forEach(btn=>{
      btn.onclick = ()=>{
        filterBtns.forEach(b=>b.classList.remove('active'))
        btn.classList.add('active');
        currentFilter = btn.dataset.val;
        loadTasks();
      }
    })
    loadTasks();
  </script>
</body>
</html>
